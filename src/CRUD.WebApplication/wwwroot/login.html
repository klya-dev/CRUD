<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Войти</title>
    <link rel="stylesheet" href="/lib/bootstrap-icons/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/bootswatchTheme.css" />
    <link rel="stylesheet" href="/style.css" />
</head>
<body>
    <iframe src="header.html" onload="this.before((this.contentDocument.body||this.contentDocument).children[0]);this.remove()"></iframe>

    <div class="wrapper">
        <div class="container mt-5">
            <main role="main" class="pb-3">
                <h1 class="text-center mb-3">Войти</h1>

                <form>
                    <span id="login_errors" class="text-danger"></span>
                    <p>
                        <label>Введите username</label><br />
                        <input class="form-control" id="login_username" />
                    </p>
                    <p>
                        <label>Введите пароль</label><br />
                        <input class="form-control" id="login_password" />
                    </p>
                    <input class="btn btn-info" onclick="Login()" value="Войти" />
                </form>
            </main>
        </div>

        <iframe src="footer.html" onload="this.before((this.contentDocument.body||this.contentDocument).children[0]);this.remove()"></iframe>
    </div>

    <script src="main.js"></script>

    <script>
        async function Login() {
            // Отправляет запрос и получаем ответ
            const response = await fetch(server + "/login", {
                method: "POST",
                headers: { "Accept": "application/json", "Content-Type": "application/json", "Accept-Language": currentCulture },
                body: JSON.stringify({
                    username: document.getElementById("login_username").value,
                    password: document.getElementById("login_password").value
                })
            });

            // Если запрос прошёл нормально
            if (response.ok === true) {
                // Получаем данные
                const data = await response.json();

                // Сохраняем в хранилище sessionStorage токен доступа
                sessionStorage.setItem(accessToken, data.access_token);
                sessionStorage.setItem(tokenUsername, data.username);

                alert("авторизация успешна");
            }
            else { // Если произошла ошибка
                var errorMessage = await responseError(response);

                // Вставка всех ошибок в элемент
                document.getElementById("login_errors").innerText = errorMessage;
            }
        }
    </script>

    <script src="/lib/bootstrap/bootstrap.bundle.min.js"></script>
</body>
</html>
